<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-label="Sequência de contribuições no GitHub" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{font-family:'Segoe UI',Ubuntu,Sans-Serif}
.n{font-size:34px;font-weight:700} .l{font-size:14px;font-weight:600;fill:#fe428e} .s{font-size:12px;fill:#8b8aa8}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c{opacity:0;animation:pop .6s ease-out forwards}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.55}} .ring{animation:glow 2.4s ease-in-out infinite}
</style>
<rect x="0.5" y="0.5" width="599" height="169" rx="6" fill="#141321" stroke="#2a2840"/>
<line x1="200" y1="30" x2="200" y2="140" stroke="#2a2840"/>
<line x1="400" y1="30" x2="400" y2="140" stroke="#2a2840"/>
<g class="c" style="animation-delay:0.0s">
<text class="n" x="100" y="80" text-anchor="middle" fill="#a9fef7">35</text>
<text class="l" x="100" y="125" text-anchor="middle">Total de contribuições</text>
<text class="s" x="100" y="145" text-anchor="middle">desde 8 mai 2026</text>
</g>
<g class="c" style="animation-delay:0.2s">
<circle class="ring" cx="300" cy="68" r="38" fill="none" stroke="#A855F7" stroke-width="3"/>
<text class="n" x="300" y="80" text-anchor="middle" fill="#A855F7">1</text>
<text class="l" x="300" y="125" text-anchor="middle">Sequência atual (dias)</text>
<text class="s" x="300" y="145" text-anchor="middle">26 out</text>
</g>
<g class="c" style="animation-delay:0.4s">
<text class="n" x="500" y="80" text-anchor="middle" fill="#a9fef7">5</text>
<text class="l" x="500" y="125" text-anchor="middle">Maior sequência (dias)</text>
<text class="s" x="500" y="145" text-anchor="middle">6 out – 10 out</text>
</g>
</svg>
